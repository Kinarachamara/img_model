  }
  .sender {
    font-weight: bold;
    margin-bottom: 3px;

const chatBox = document.getElementById('chatBox');
const lines = chatText.trim().split('\n');

lines.forEach(line => {
  const match = line.match(/^\[(.*?)\]\s(.*?):\s(.*)$/);
  if (match) {
    const time = match[1];
    const sender = match[2];
    const message = match[3];
    const div = document.createElement('div');
    div.classList.add('msg');

    if (sender.includes('Kinara')) {
      div.classList.add('me');
      div.innerHTML = `<div class="sender">${meName}</div>${message}<div class="timestamp">${time}</div>`;
    } else {
      div.classList.add('other');
      div.innerHTML = `<div class="sender">${otherName}</div>${message}<div class="timestamp">${time}</div>`;
    }

    chatBox.appendChild(div);
  }
});

chatBox.scrollTop = chatBox.scrollHeight;
