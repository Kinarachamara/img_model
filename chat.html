// 🟩 Lazy Load Config
const CHUNK_SIZE = 200; // පළවෙනි එකට load වෙන සංඛ්‍යාව
let messages = [];
let currentIndex = 0;

// 🧠 Message Parsing Function
function parseMessages(text) {
  const lines = text.trim().split(/\n+/);
  return lines.map(line => {
    const match = line.match(/^(\d{1,2}\/\d{1,2}\/\d{2,4}),\s(\d{1,2}:\d{2})\s-\s([^:]+):\s([\s\S]*)$/);
    if (!match) return null;
    const [, date, time, sender, msg] = match;
    const who = sender.includes(meName) ? "me" : "other";
    return { date, time, sender, msg, who };
  }).filter(Boolean);
}

// 🧱 Render Chat Function
function renderChunk() {
  const chatBox = document.getElementById("chatBox");
  const end = Math.min(currentIndex + CHUNK_SIZE, messages.length);
  const fragment = document.createDocumentFragment();

  for (let i = currentIndex; i < end; i++) {
    const m = messages[i];
    const div = document.createElement("div");
    div.className = `msg ${m.who}`;
    div.innerHTML = `
      <div>${m.msg.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>
      <div class="timestamp">${m.time}</div>
    `;
    fragment.appendChild(div);
  }

  chatBox.appendChild(fragment);
  currentIndex = end;
}

// 🔁 Lazy Load When Scroll Bottom
document.getElementById("chatBox").addEventListener("scroll", function() {
  const box = this;
  if (box.scrollTop + box.clientHeight >= box.scrollHeight - 50) {
    renderChunk();
  }
});

// 🏁 Initialize
window.addEventListener("load", () => {
  messages = parseMessages(chatText);
  renderChunk(); // load first 200
});
</script>
